<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Client Portal</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 18px; }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-logo {
      width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800;
      margin: 0 auto 14px;
    }
    .auth-title { text-align: center; margin-bottom: 4px; }
    .auth-sub { text-align: center; color: var(--ink-soft); margin-bottom: 22px; }
    .auth-card { max-width: 440px; }
    .setup-steps { margin: 0 0 18px; padding-left: 20px; color: var(--ink-soft); font-size: 0.92rem; line-height: 1.7; }
    .setup-steps li { margin-bottom: 6px; }
    .mfa-secret {
      display: inline-block; font-size: 1.02rem; letter-spacing: 0.08em; font-weight: 700;
      background: var(--bg); color: var(--ink); padding: 3px 8px; border-radius: 6px;
      user-select: all; word-break: break-all;
    }
    .recovery-codes {
      list-style: none; margin: 0 0 20px; padding: 14px; border-radius: 10px;
      background: var(--bg);
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px;
    }
    .recovery-codes code { font-size: 0.95rem; letter-spacing: 0.04em; user-select: all; }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-logo" aria-hidden="true">M</div>
    <div class="card" id="auth-box" aria-live="polite">
      <p class="muted">Loading…</p>
    </div>
    <p class="faint" style="text-align:center">Secure client portal. Never share your password with anyone.</p>
  </main>
  <script src="/app-common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
